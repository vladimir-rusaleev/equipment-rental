global:
  scrape_interval: 15s
  scrape_timeout: 5s

scrape_configs:
  - job_name: gateway
    static_configs:
      - targets: [gateway:8080]
  - job_name: rental
    static_configs:
      - targets: [rental:9091]
  - job_name: inventory
    static_configs:
      - targets: [inventory:9091]
  - job_name: notifier
    static_configs:
      - targets: [notifier:9091]
