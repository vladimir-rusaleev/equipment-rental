services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: rent_owner
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: rent-test-owner-password
      APP_DB_PASSWORD: rent-test-password
      CREATE_TEST_DATABASES: "true"
    ports:
      - "127.0.0.1::5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./docker/postgres/init-db.sh:/docker-entrypoint-initdb.d/10-services.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U rent_owner -d postgres"]
      interval: 1s
      timeout: 3s
      retries: 40
